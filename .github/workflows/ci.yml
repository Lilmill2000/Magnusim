name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnusim-web/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          if [ -f requirements.lock ]; then pip install -r requirements.lock; fi
          pip install -e ".[dev]"
          pip install -e sdk
      - name: Ruff
        run: ruff check cfddesk tools tests ../bundled-plugins
      - name: Mypy
        run: mypy cfddesk ../bundled-plugins/incompressible_flow/incompressible_flow ../bundled-plugins/incompressible_flow/plugin.py
      # testpaths: the core's tests, Incompressible Flow's (its goldens) and the plugin template's.
      - name: Pytest (including CAD, without WSL)
        run: pytest --tb=short
  node:
    runs-on: ubuntu-latest
    env:
      MAGNUSIM_STRICT_SCOPE: "1"
    defaults:
      run:
        working-directory: magnusim-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: magnusim-web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend for API and golden tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run test:unit
      - run: npm run gen:registry:check
      - run: npm run gen:plugin-sdk:check
      # docs/plugins/API.md and manifest.schema.json are generated from the code, and
      # every code block tagged `test` in docs/plugins runs.
      - run: npm run gen:plugin-docs:check
      - run: npm run test:docs
      # Every bundled plugin against the plugin rules. Their own tests run where their
      # toolchains are: the python job's pytest and the cad-plugin job.
      - run: npm run plugin:check -- --no-tests bundled-plugins/*
      - run: npm run test:js-case
      - run: npm run build
      # The UI kit dev sheet (#/dev/ui-kit) is dev-only: the build must not hold it.
      - run: node scripts/check-build-no-dev-sheet.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      # Incompressible Flow's own browser suite, on the same Playwright and app server
      # (its tests that mesh or solve skip here: CI has no WSL).
      - run: npx playwright test -c bundled-plugins/incompressible_flow/e2e/playwright.config.js
        env:
          CI: "1"
      # The Airfoil plugin's browser suite (it ships off; each test starts its own app
      # server with it on). Its workspace, OpenFOAM-runs and folder-removed tests run here.
      # The XFOIL test skips (xfoil.exe is MIT's Windows build), and so do the NeuralFoil
      # gate (its environment is not built here and CI does not download it) and the
      # OpenFOAM gate (no WSL), each with its reason.
      - run: npx playwright test -c bundled-plugins/airfoil/e2e/playwright.config.js
        env:
          CI: "1"

  # The analysis contract's boundary: the core never imports a bundled plugin,
  # plugins import only magnusim_sdk, cfddesk.registry and the standard library,
  # the core names no incompressible physics, the core's packages import only
  # what tools/core_layers.py allows, and magnusim_sdk imports with nothing else
  # installed.
  plugin-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnusim-web/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import boundary
        run: python tools/plugin_boundary.py
      - name: No core physics
        run: python tools/core_physics_scan.py
      # Which cfddesk packages may import which (a new dependency is added on purpose).
      - name: Core package dependencies
        run: python tools/core_layers.py
      - name: magnusim_sdk alone
        run: |
          python -m venv "$RUNNER_TEMP/sdk-only"
          "$RUNNER_TEMP/sdk-only/bin/pip" install ./sdk
          "$RUNNER_TEMP/sdk-only/bin/python" -c "import sys, magnusim_sdk, magnusim_sdk.events, magnusim_sdk.units, magnusim_sdk.foam, magnusim_sdk.gmsh_helpers, magnusim_sdk.msh22, magnusim_sdk.proc, magnusim_sdk.study, magnusim_sdk.fluids, magnusim_sdk.progress, magnusim_sdk.data, magnusim_sdk.service; bad = [m for m in sys.modules if m.split('.')[0] in {'OCP', 'pyvista', 'gmsh', 'numpy', 'cfddesk'}]; assert not bad, bad; print('magnusim_sdk imports alone')"

  # The app ships no user plugins. Prove the core suites pass with no user plugin
  # folder at all (the plugin-host gates are tagged @plugins and run in "node").
  core-without-user-plugins:
    runs-on: ubuntu-latest
    env:
      MAGNUSIM_STRICT_SCOPE: "1"
    defaults:
      run:
        working-directory: magnusim-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: magnusim-web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - name: Empty plugins folder
        run: |
          mkdir -p "$RUNNER_TEMP/no-plugins"
          echo "MAGNUSIM_E2E_PLUGINS_DIR=$RUNNER_TEMP/no-plugins" >> "$GITHUB_ENV"
      - run: npm run test:server
      - run: npm run test:unit
      - run: npm run gen:registry:check
      - run: cd python && pytest --tb=short
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @plugins e2e/smoke.spec.js e2e/lifecycle.spec.js
        env:
          CI: "1"

  # The bundled plugins that are not required may ship on (manifest default_enabled),
  # so every other job runs the core with them. Prove the core works without them:
  # a bundled folder holding only the required plugins (a top-level `required = true`
  # in the manifest), a check that the worker loads from it, then pytest, and smoke
  # plus lifecycle.
  core-without-optional-plugins:
    runs-on: ubuntu-latest
    env:
      MAGNUSIM_STRICT_SCOPE: "1"
    defaults:
      run:
        working-directory: magnusim-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: magnusim-web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - name: Only the required bundled plugins
        run: |
          dest="$RUNNER_TEMP/required-bundled"
          mkdir -p "$dest"
          for m in bundled-plugins/*/manifest.toml; do
            # The top-level keys are the lines before the first [table].
            if sed '/^\s*\[/q' "$m" | grep -Eq '^\s*required\s*=\s*true\s*(#.*)?$'; then
              cp -r "$(dirname "$m")" "$dest/"
            fi
          done
          ls "$dest"
          test -n "$(ls -A "$dest")"
          echo "MAGNUSIM_BUNDLED_DIR=$dest" >> "$GITHUB_ENV"
      # The worker reads MAGNUSIM_BUNDLED_DIR: the bundled plugins it finds, on or off,
      # are the copied ones, not the repo's. (The registry golden is the node job's:
      # gen:registry always dumps the repo's bundled-plugins/.)
      - name: The worker finds only the copied plugins
        working-directory: magnusim-web/python
        run: |
          python - <<'EOF'
          import os, tomllib
          from pathlib import Path
          from cfddesk.registry import load_all

          def keys(folder):
              out = set()
              for m in Path(folder).glob("*/manifest.toml"):
                  meta = tomllib.loads(m.read_text(encoding="utf-8"))
                  out.add(str(meta.get("key") or m.parent.name))
              return out

          copied = keys(os.environ["MAGNUSIM_BUNDLED_DIR"])
          shipped = keys("../bundled-plugins")
          hub = load_all(force=True)
          found = {m.key for m in hub.manifests.values() if m.source == "bundled"}
          found |= {r["key"] for r in hub.off_plugins if r["source"] == "bundled"}
          print("copied:", sorted(copied), "found:", sorted(found), "shipped:", sorted(shipped))
          assert copied < shipped, "the copy holds every bundled plugin: nothing optional is left out"
          assert found == copied, "the worker's bundled plugins are not the copied ones"
          EOF
      # The core's tests. The plugins' own tests run in the python job (here a plugin
      # would load from the copy while its tests import it from bundled-plugins/).
      - run: cd python && pytest --tb=short tests
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/smoke.spec.js e2e/lifecycle.spec.js
        env:
          CI: "1"

  # Magnusim CAD (bundled; its manifest says whether it ships on): its own toolchain
  # in bundled-plugins/cad. Its unit tests load the real kernel wasm in Node; its e2e
  # starts this checkout's app with CAD on.
  cad-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnusim-web/bundled-plugins/cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            magnusim-web/package-lock.json
            magnusim-web/bundled-plugins/cad/package-lock.json
      - name: App dependencies (the e2e host server)
        working-directory: magnusim-web
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend (the app's worker)
        working-directory: magnusim-web
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:check
      # The plugin rules, with CAD's own tests (its packages are installed here).
      - name: plugin:check
        working-directory: magnusim-web
        run: npm run plugin:check -- bundled-plugins/cad
      - run: npx playwright install --with-deps chromium
      - name: e2e (bundled Chromium)
        run: npm run test:e2e
        env:
          CI: "1"
      # The LINK gate fails, never skips, without the app's Python (the setup-python one
      # here, with the backend installed above): its checker tests and link e2e must run.
      # gate:l3-cad is local only: it needs a private STEP file that never goes to GitHub.
      - name: gate:l2-cad
        run: npm run test:gate:l2-cad
        env:
          CI: "1"
