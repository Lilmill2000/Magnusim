name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfd-web/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install -r requirements.lock; fi
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check cfddesk tools tests
      - name: Mypy
        run: mypy cfddesk
      - name: Pytest (no WSL/OCCT)
        run: pytest -m "not wsl and not occt"
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfd-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cfd-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
