name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfd-web/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          if [ -f requirements.lock ]; then pip install -r requirements.lock; fi
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check cfddesk tools tests
      - name: Mypy
        run: mypy cfddesk
      - name: Pytest (including CAD, without WSL)
        run: pytest -m "not wsl"
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfd-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cfd-web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend for API and golden tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run test:unit
      - run: npm run gen:registry:check
      - run: npm run test:js-case
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"

