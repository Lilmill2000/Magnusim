name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnusim-web/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          if [ -f requirements.lock ]; then pip install -r requirements.lock; fi
          pip install -e ".[dev]"
          pip install -e sdk
      - name: Ruff
        run: ruff check cfddesk tools tests ../bundled-plugins
      - name: Mypy
        run: mypy cfddesk ../bundled-plugins/incompressible_flow/incompressible_flow
      # testpaths: the core's tests, Incompressible Flow's (its goldens) and the plugin template's.
      - name: Pytest (including CAD, without WSL)
        run: pytest --tb=short
  node:
    runs-on: ubuntu-latest
    env:
      MAGNUSIM_STRICT_SCOPE: "1"
    defaults:
      run:
        working-directory: magnusim-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: magnusim-web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend for API and golden tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run test:unit
      - run: npm run gen:registry:check
      - run: npm run gen:plugin-sdk:check
      - run: npm run test:js-case
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"

  # The analysis contract's boundary: the core never imports a bundled plugin,
  # plugins import only magnusim_sdk, cfddesk.registry and the standard library,
  # the core names no incompressible physics, and magnusim_sdk imports with
  # nothing else installed.
  plugin-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnusim-web/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import boundary
        run: python tools/plugin_boundary.py
      - name: No core physics
        run: python tools/core_physics_scan.py
      - name: magnusim_sdk alone
        run: |
          python -m venv "$RUNNER_TEMP/sdk-only"
          "$RUNNER_TEMP/sdk-only/bin/pip" install ./sdk
          "$RUNNER_TEMP/sdk-only/bin/python" -c "import sys, magnusim_sdk, magnusim_sdk.events, magnusim_sdk.units, magnusim_sdk.foam, magnusim_sdk.gmsh_helpers, magnusim_sdk.msh22, magnusim_sdk.proc; bad = [m for m in sys.modules if m.split('.')[0] in {'OCP', 'pyvista', 'gmsh', 'numpy', 'cfddesk'}]; assert not bad, bad; print('magnusim_sdk imports alone')"

  # The app ships no plugins. Prove the core suites pass with no user plugin
  # folder at all (the plugin-host gates are tagged @plugins and run in "node").
  core-without-user-plugins:
    runs-on: ubuntu-latest
    env:
      MAGNUSIM_STRICT_SCOPE: "1"
    defaults:
      run:
        working-directory: magnusim-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: magnusim-web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - name: Empty plugins folder
        run: |
          mkdir -p "$RUNNER_TEMP/no-plugins"
          echo "MAGNUSIM_E2E_PLUGINS_DIR=$RUNNER_TEMP/no-plugins" >> "$GITHUB_ENV"
      - run: npm run test:server
      - run: npm run test:unit
      - run: npm run gen:registry:check
      - run: cd python && pytest --tb=short
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @plugins e2e/smoke.spec.js e2e/lifecycle.spec.js
        env:
          CI: "1"

  # Magnusim CAD (bundled, ships off): its own toolchain in bundled-plugins/cad.
  # Its unit tests load the real kernel wasm in Node; its e2e starts this
  # checkout's app with CAD turned on, the way Settings' Enable does.
  cad-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnusim-web/bundled-plugins/cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            magnusim-web/package-lock.json
            magnusim-web/bundled-plugins/cad/package-lock.json
      - name: App dependencies (the e2e host server)
        working-directory: magnusim-web
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python backend (the app's worker)
        working-directory: magnusim-web
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install -r python/requirements.lock
          python -m pip install -e "python[dev]"
          python -m pip install -e python/sdk
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:check
      - run: npx playwright install --with-deps chromium
      - name: e2e (bundled Chromium)
        run: npm run test:e2e
        env:
          CI: "1"
