key = "incompressible_flow"
name = "Incompressible Flow"
version = "1.1.0"
api_version = "1.8"
tier = "bundled"
required = true
license = "GPL-3.0-or-later"
description = "Steady-state and transient incompressible flow of one fluid (simpleFoam, pimpleFoam)."
authors = ["Magnusim"]
# The study and run panels' settings (TSX, bundled by the host when served).
ui = "ui"
ui_entry = "index.tsx"
# Modules another plugin may import when it names incompressible_flow in its
# requires_plugins (host API 1.8): the flow boundary conditions (U and
# turbulence per patch) a solver of the same flow reuses.
exports = ["incompressible_flow.flow_bcs"]
protected = [
  "analysis:incompressible_steady",
  "analysis:incompressible_transient",
  "solver:simpleFoam",
  "solver:pimpleFoam",
  "material:newtonian_incompressible",
  "monitor:area_average",
  "monitor:force",
  "monitor:flow_rate",
  "monitor:forces",
  "monitor:probe",
  "bc:velocity_inlet_fixed",
  "bc:velocity_inlet_volumetric",
  "bc:velocity_inlet_mass",
  "bc:velocity_outlet",
  "bc:pressure_outlet_gauge",
  "bc:wall_noslip",
  "bc:wall_slip",
  "bc:symmetry",
  "bc:freestream",
  "bc:total_pressure_inlet",
  "bc:wall_moving",
  "bc:wall_rotating",
  "bc_family:velocity_inlet",
  "bc_family:velocity_outlet",
  "bc_family:pressure_outlet",
  "bc_family:wall",
  "bc_family:symmetry",
  "bc_family:freestream",
  "bc_family:total_pressure_inlet",
]
# The analysis a study gets when none is named (new studies, and studies saved
# before analysis keys, which named it "incompressible"), and the name a study
# gets when a project file stores none.
default_analysis = { steady = "incompressible_steady", transient = "incompressible_transient", aliases = ["incompressible"], study_name = "Incompressible" }
