key = "incompressible_flow"
name = "Incompressible Flow"
version = "1.0.0"
api_version = "1.4"
tier = "bundled"
required = true
license = "GPL-3.0-or-later"
description = "Steady-state and transient incompressible flow of one fluid (simpleFoam, pimpleFoam)."
authors = ["Magnusim"]
# The study and run panels' settings (TSX, bundled by the host when served).
ui = "ui"
ui_entry = "index.tsx"
protected = [
  "analysis:incompressible_steady",
  "analysis:incompressible_transient",
  "solver:simpleFoam",
  "solver:pimpleFoam",
  "material:newtonian_incompressible",
  "monitor:area_average",
  "monitor:flow_rate",
]
# The analysis a study gets when none is named (new studies, and studies saved
# before analysis keys, which named it "incompressible").
default_analysis = { steady = "incompressible_steady", transient = "incompressible_transient", aliases = ["incompressible"] }
