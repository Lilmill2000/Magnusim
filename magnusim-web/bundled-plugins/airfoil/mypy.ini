# mypy for the plugin, run from this folder with the core's Python: mypy airfoil airfoil_service.py jobs
# NeuralFoil, AeroSandbox and Gmsh are in the plugin's own environment (requirements.lock), not
# the core's, and ship no type information.
[mypy]
mypy_path = ../../python/sdk

[mypy-aerosandbox.*,neuralfoil.*,gmsh]
ignore_missing_imports = True
