key = "cad"
name = "Magnusim CAD"
version = "0.1.0"
# 1.3: the workspace imports the host's UI kit (@magnusim/plugin-ui); a 1.2 host
# cannot load it. It also uses ws.files and nav.setDirty (1.2).
api_version = "1.3"
tier = "bundled"
required = false
# Ships off: nothing of CAD runs, and existing projects look unchanged, until
# someone turns it on in Settings > Plugins (host API 1.2, G11).
default_enabled = false
license = "GPL-3.0-or-later"
description = "Parametric parts in their own workspace: sketches with dimensions and constraints, extruded into solids, booleans, an enclosure around the part for CFD, named parameters, and STEP import, editing and export."
authors = ["Magnusim"]
# No [python]: all modeling runs in the workspace's own workers (OCCT and
# PlaneGCS compiled to WebAssembly). plugin.py is the only Python file here.

# What the Part workspace may keep in one project through ws.files and ws.data
# (models, and later imported STEP files): one file, and all of them together.
[files]
max_file_mb = 512
max_total_mb = 4096

[[workspaces]]
key = "part"
title = "Part"
icon = "M4 8l8-4 8 4v8l-8 4-8-4z M4 8l8 4 8-4 M12 12v8"
entry = "workspace/index.html"

[[study_kinds]]
key = "part"
title = "Part"
icon = "M4 8l8-4 8 4v8l-8 4-8-4z M4 8l8 4 8-4 M12 12v8"
workspace = "part"
schema_version = 1
