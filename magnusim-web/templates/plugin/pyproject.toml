[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "magnusim-plugin-template"
version = "0.1.0"
description = "Copy-paste Magnusim plugin"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["cfddesk"]

# The plugin folder itself is the package, so the entry point is namespaced and
# two plugins built from this template never collide on a top-level "plugin".
[tool.setuptools]
package-dir = { "magnusim_plugin_template" = "." }
packages = ["magnusim_plugin_template"]

[project.entry-points."cfddesk.plugins"]
template-demo = "magnusim_plugin_template.plugin:register"
