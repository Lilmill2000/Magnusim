key = "my-workspace"
name = "My workspace"
version = "0.1.0"
api_version = "1.7"
license = "GPL-3.0-or-later"
description = "A plugin with its own full workspace: copy this folder to start one"
authors = "Your Name"

# The page the host shows in a sandboxed frame (docs/plugins/authoring.md, "Workspaces (1.1)").
[[workspaces]]
key = "sketch"
title = "Sketch"
icon = "M4 5h16v14H4z M4 9h16"
entry = "workspace/index.html"

# A study of this kind opens in that workspace.
[[study_kinds]]
key = "sketch"
title = "Sketch"
icon = "M5 19V5h14v14z M9 9h6v6H9z"
workspace = "sketch"
schema_version = 1
# Host 1.5 and later: a study of this kind may link one project geometry
# (authoring.md, "Linking a geometry (1.5)"). Remove the "# " to opt in.
# links_geometry = true

# Host 1.4 and later: a button that creates a study of this kind and opens it,
# in the empty project, the header, the New Project dialog and Home
# (authoring.md, "Start actions (1.4)"). Remove the "# " to add it.
# [[start_actions]]
# study_kind = "sketch"
# label = "Start a sketch"
# hint = "Draw it here, then simulate it"
# places = ["empty_project", "header", "new_project", "home"]
# home_label = "New sketch"
# header_label = "Sketch"

# Host 1.7 and later: "Edit in Sketch" on a project geometry (a STEP, IGES or BREP
# import), in the tree's and the viewport's right-click menus and the Geometry panel.
# It needs links_geometry = true above (authoring.md, "Editing a project geometry (1.7)").
# Remove the "# " to add it.
# [[geometry_actions]]
# study_kind = "sketch"
# label = "Edit in Sketch"
# hint = "Open this part here. Back updates it in the project."
# formats = ["step", "iges", "brep"]
# places = ["tree", "viewport", "panel"]
